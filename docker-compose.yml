services:
  web:
    build:
      context: ./app
      args:
        # Package source. Defaults to Chainguard Libraries (no PyPI fallback).
        # Override only to point at a repository manager that proxies Chainguard Libraries.
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://libraries.cgr.dev/python/simple/}
      # Chainguard credentials are passed as build secrets, never stored in the image.
      secrets:
        - cg_identity_id
        - cg_token
    ports:
      - "127.0.0.1:8000:8000"   # reachable from this machine only
    environment:
      # Driver named explicitly (pg8000) so a library upgrade can't silently change it.
      DATABASE_URL: postgresql+pg8000://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-todos}
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres is ready, not just started
    healthcheck:
      # No shell or curl in the image, so the check uses Python itself.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Runtime hardening
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  db:
    image: postgres:15@sha256:91b9edc40277faf94bc1e3d7ae621b185fa70f3099b94309c4731a8296114870
    # No published port: only the app can reach the database, over the Compose network.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

volumes:
  postgres_data:

secrets:
  cg_identity_id:
    environment: CHAINGUARD_PYTHON_IDENTITY_ID
  cg_token:
    environment: CHAINGUARD_PYTHON_TOKEN